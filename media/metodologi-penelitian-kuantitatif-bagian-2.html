    .theory-layout{display:grid;grid-template-columns:590px 1fr;gap:25px;height:535px}.theory-flow{padding:22px;display:flex;flex-direction:column;justify-content:center}.flow-line{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;align-items:center}.flow-line:before{content:"";position:absolute;left:8%;right:8%;top:38px;height:3px;background:linear-gradient(90deg,var(--gold3),var(--gold2),var(--teal));transform-origin:left;animation:grow 2.4s var(--ease) infinite alternate}@keyframes grow{from{transform:scaleX(.15)}to{transform:scaleX(1)}}.flow-node{position:relative;z-index:2;text-align:center}.flow-node .orb{display:grid;place-items:center;width:78px;height:78px;margin:auto;border-radius:50%;background:#2a1c13;border:2px solid var(--gold);box-shadow:0 0 0 8px rgba(213,170,85,.07);font-size:28px}.flow-node b{display:block;margin-top:13px;color:var(--gold2);font-size:17px}.flow-node span{display:block;margin-top:4px;color:var(--muted);font-size:13px}.theory-why{margin-top:30px;padding:15px 17px;border-left:4px solid var(--gold);background:rgba(213,170,85,.08);font-size:18px;line-height:1.4}

    .blueprint-layout{height:500px;margin-top:22px;position:relative}.blueprint-table{width:100%;border-collapse:separate;border-spacing:0;font-size:15px;overflow:hidden;border-radius:17px;border:1px solid var(--line)}.blueprint-table th{background:#e4c995;color:var(--ink);text-align:left;padding:12px}.blueprint-table td{padding:11px 12px;border-top:1px solid rgba(240,205,130,.13);vertical-align:top;color:var(--cream2)}.blueprint-table tr:nth-child(even) td{background:rgba(255,255,255,.025)}.blueprint-table b{color:var(--cream)}.chip-bank{display:flex;gap:10px;margin-top:15px;align-items:center}.move-chip{position:relative;padding:8px 11px;border-radius:99px;background:var(--brown3);border:1px solid var(--line);font-size:14px;transition:.4s}.blueprint-layout.running .move-chip:nth-child(2){animation:chipMove1 1.25s var(--ease) both}.blueprint-layout.running .move-chip:nth-child(3){animation:chipMove2 1.25s .18s var(--ease) both}.blueprint-layout.running .move-chip:nth-child(4){animation:chipMove3 1.25s .36s var(--ease) both}@keyframes chipMove1{45%{transform:translate(300px,-90px) scale(1.12)}100%{transform:translate(520px,-295px) scale(.78);opacity:.25}}@keyframes chipMove2{45%{transform:translate(440px,-70px) scale(1.12)}100%{transform:translate(720px,-224px) scale(.78);opacity:.25}}@keyframes chipMove3{45%{transform:translate(570px,-55px) scale(1.12)}100%{transform:translate(930px,-158px) scale(.78);opacity:.25}}
    .item-lab{display:grid;grid-template-columns:440px 1fr;gap:22px;height:525px}.item-index{display:grid;gap:10px;padding:17px}.item-tab{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:13px;padding:13px 15px;cursor:pointer}.item-tab b{display:block;color:var(--gold2)}.item-tab span{font-size:13px;color:var(--muted)}.item-tab.active{background:rgba(213,170,85,.16);transform:translateX(7px)}.rewrite{padding:26px;position:relative}.rewrite h3{font:700 27px Georgia,serif;color:var(--gold2)}.sentence{padding:18px;border-radius:15px;margin-top:14px;font-size:19px;line-height:1.4}.sentence.bad{background:rgba(201,111,98,.11);border:1px solid rgba(201,111,98,.35)}.sentence.good{background:rgba(140,162,122,.11);border:1px solid rgba(140,162,122,.35);opacity:.18;transform:translateY(16px);transition:.55s var(--ease)}.rewrite.revealed .sentence.bad{transform:translateX(-18px);opacity:.35;text-decoration:line-through}.rewrite.revealed .sentence.good{opacity:1;transform:none}.rewrite button{margin-top:18px}.principles{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
    .likert-stage{display:grid;grid-template-columns:1fr 420px;gap:24px;height:510px}.survey-card{padding:26px}.survey-card .statement{font:700 27px/1.35 Georgia,serif;margin:22px 0;color:var(--ink)}.scale-buttons{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.scale-choice{height:88px;border:1px solid rgba(68,45,25,.16);border-radius:13px;background:rgba(255,255,255,.55);color:var(--ink);cursor:pointer;font-size:13px;font-weight:750}.scale-choice b{display:block;font:700 25px Georgia;margin-bottom:5px}.scale-choice:hover,.scale-choice.active{background:#3d2a1d;color:var(--gold2);transform:translateY(-5px)}.response-output{margin-top:20px;display:flex;align-items:center;gap:14px;padding:13px;border-radius:13px;background:rgba(61,42,29,.1);color:var(--ink)}.reverse-switch{margin-top:13px;display:flex;align-items:center;gap:10px;color:#563b22;font-size:14px}.likert-notes{padding:22px}.likert-notes h3{color:var(--gold2);font:700 25px Georgia,serif}.likert-notes .note{padding:13px 0;border-bottom:1px solid var(--line)}.likert-notes .note b{display:block;color:var(--cream);font-size:17px}.likert-notes .note span{font-size:14px;color:var(--muted);line-height:1.32}

    const head=(no,kicker,title,lead)=>`<div class="scene-no">${String(no).padStart(2,'0')}</div><div class="kicker" data-anim>${kicker}</div><h2 data-anim style="--d:120ms">${title}</h2><p class="lead" data-anim style="--d:180ms">${lead}</p>`;

    const slides=[
      {title:'Sampul',cls:'cover',html:`<div class="cover-bg"><img src="${IMG.hero}" alt="Instrumen penelitian, visual data, populasi dan sampel"></div><div class="cover-copy"><div class="cover-badge" data-anim>Metodologi Penelitian Kuantitatif</div><h1 data-anim style="--d:150ms">Dari Variabel Menjadi Data,<br><span class="accent">dari Populasi Menjadi Sampel</span></h1><p class="sub" data-anim style="--d:250ms">Bagian 2 • Penyusunan angket, validitas–reliabilitas, dan penentuan sampel.</p><div class="cover-meta" data-anim style="--d:360ms"><div class="line"></div><div><strong>Najib Mubarok, M.Sc.</strong><span>INISNU Temanggung</span></div></div></div><div class="cover-pillars" data-anim style="--d:460ms"><span>ANGKET</span><span>DATA</span><span>SAMPEL</span></div>`},
      {title:'Kasus Angket Bermasalah',html:head(2,'Putaran 1 • Kasus','Angket Sudah Jadi. <span class="red">Apakah Sudah Mengukur?</span>','Penelitian ingin menguji pengaruh keterlibatan belajar terhadap hasil belajar siswa SMP. Empat butir berikut tampak masuk akal—tetapi menyimpan masalah.')+`<div class="case-layout content" data-anim style="--d:240ms"><div class="visual case-image"><img src="${IMG.instrument}" alt="Peneliti menyusun angket dari literatur"><span class="img-label">Kasus: variabel keterlibatan belajar</span></div><div class="cream-panel" style="padding:19px"><span class="tag" style="color:#61411f;border-color:rgba(80,48,20,.2)">Klik setiap butir untuk diagnosis</span><div class="bad-list" id="badList"><button class="bad-item active" data-bad="0"><b>1</b>Saya selalu aktif dan bahagia mengikuti semua pelajaran.</button><button class="bad-item" data-bad="1"><b>2</b>Guru saya mengajar dengan baik sehingga saya rajin belajar.</button><button class="bad-item" data-bad="2"><b>3</b>Saya bukan siswa yang tidak pernah mengabaikan tugas.</button><button class="bad-item" data-bad="3"><b>4</b>Saya terlibat dalam pembelajaran.</button></div><div class="bad-diagnosis" id="badDiagnosis"><strong>Dua gagasan dalam satu butir</strong><p>“Aktif” dan “bahagia” dapat menghasilkan dua jawaban berbeda. Satu butir sebaiknya meminta satu keputusan.</p></div></div></div>`+note('Pengembangan butir dimulai dari definisi konstruk dan cakupan kontennya, bukan dari kalimat yang sekadar terdengar baik <span class="body-note">(Boateng et al., 2018)</span>.')},
      {title:'Diagnosis Angket',html:head(3,'Analisis bersama','Empat Sumber <span class="accent">Kesalahan Butir</span>','Gunakan lensa diagnosis: satu gagasan, kesesuaian konstruk, kejelasan bahasa, dan keterukuran perilaku.')+`<div class="clinic content"><div class="cream-panel patient" data-anim style="--d:240ms"><span class="tag" style="width:max-content;color:#69451f;border-color:rgba(90,50,20,.2)">BUTIR PASIEN</span><div class="quote" id="patientQuote">“Saya selalu aktif dan bahagia mengikuti semua pelajaran.”</div><div class="underline"></div></div><div class="clinic-tools" id="clinicTools" data-anim style="--d:300ms"><button class="tool active" data-tool="0"><span class="ico">②</span><b>Double-barreled</b><span>Dua gagasan diminta dalam satu respons.</span></button><button class="tool" data-tool="1"><span class="ico">⌖</span><b>Salah konstruk</b><span>Butir mengukur guru, bukan keterlibatan siswa.</span></button><button class="tool" data-tool="2"><span class="ico">↺</span><b>Negasi ganda</b><span>Makna menjadi berat dan mudah disalahpahami.</span></button><button class="tool" data-tool="3"><span class="ico">?</span><b>Terlalu abstrak</b><span>“Terlibat” belum menunjukkan perilaku teramati.</span></button><div class="panel clinic-result"><i>🔎</i><p id="clinicResult"><b class="accent">Perbaikan:</b> pecah menjadi “Saya mengajukan pertanyaan ketika materi belum saya pahami” dan butir emosi yang terpisah.</p></div></div></div>`},
      {title:'Mencari Teori',html:head(4,'Abstraksi • Dasar konstruk','Jangan Mulai dari Pertanyaan. <span class="accent">Mulailah dari Teori.</span>','Teori menentukan apa yang dimaksud oleh variabel, dimensi apa yang membentuknya, dan perilaku apa yang dapat menjadi indikator.')+`<div class="theory-layout content"><div class="visual"><img src="${IMG.instrument}" alt="Literatur dan perancangan instrumen"><span class="img-label">Literatur → batas konstruk</span></div><div class="panel theory-flow"><div class="flow-line"><div class="flow-node"><div class="orb">📚</div><b>Teori</b><span>sumber ilmiah</span></div><div class="flow-node"><div class="orb">◇</div><b>Konstruk</b><span>makna variabel</span></div><div class="flow-node"><div class="orb">◫</div><b>Dimensi</b><span>struktur konsep</span></div><div class="flow-node"><div class="orb">●</div><b>Indikator</b><span>tanda teramati</span></div></div><div class="theory-why"><b class="accent">Pertanyaan kunci:</b> teori mana yang paling sesuai dengan konteks, populasi, dan tujuan penggunaan skor?</div></div></div>`+note('Contoh konstruk keterlibatan sekolah memiliki dimensi perilaku, emosi, dan kognitif <span class="body-note">(Fredricks, Blumenfeld, & Paris, 2004)</span>.')},
      {title:'Adopsi Adaptasi Pengembangan',html:head(5,'Strategi instrumen','Adopsi, Adaptasi, atau <span class="accent">Mengembangkan Baru?</span>','Pilihan terbaik bukan yang paling “orisinal”, melainkan yang paling dapat dipertanggungjawabkan untuk tujuan dan konteks penelitian.')+`<div class="strategy-grid" id="strategyGrid" data-anim style="--d:240ms"><button class="panel strategy active" data-strategy="0"><span class="num">01</span><h3>Adopsi</h3><p>Gunakan instrumen yang mapan tanpa mengubah makna inti.</p><div class="when">Saat konstruk, bahasa, populasi, dan konteks sangat dekat.</div></button><button class="panel strategy" data-strategy="1"><span class="num">02</span><h3>Adaptasi</h3><p>Sesuaikan bahasa atau konteks, lalu periksa kembali bukti validitas dan reliabilitas.</p><div class="when">Saat instrumen baik, tetapi konteks berbeda.</div></button><button class="panel strategy" data-strategy="2"><span class="num">03</span><h3>Kembangkan</h3><p>Bangun butir baru melalui definisi konstruk, pengembangan item, prates, dan evaluasi psikometrik.</p><div class="when">Saat konstruk atau tujuan penggunaan belum terwakili.</div></button></div><div class="panel strategy-output" id="strategyOutput" data-anim style="--d:320ms"><span class="stat">✓</span><p><b>Adopsi bukan “salin-tempel”.</b> Pastikan izin, bahasa, populasi, skoring, dan bukti penggunaan sebelumnya tetap relevan.</p></div>`+note('Proses pengembangan skala yang baik bersifat bertahap dan iteratif: pengembangan butir, konstruksi skala, lalu evaluasi skala <span class="body-note">(Boateng et al., 2018)</span>.')},
      {title:'Definisi Operasional',html:head(6,'Dari konsep ke pengukuran','Definisi Konseptual ≠ <span class="accent">Definisi Operasional</span>','Konseptual menjawab “apa maknanya”; operasional menjawab “bagaimana konstruk dikenali dan diberi skor dalam penelitian ini”.')+`<div class="definition-stage content" data-anim style="--d:240ms"><div class="panel definition-card"><h3>Konseptual</h3><p><b>Keterlibatan belajar</b> adalah partisipasi aktif siswa dalam kegiatan akademik, disertai keterikatan emosi dan investasi kognitif.</p><ul><li>Batas makna</li><li>Relasi antarkomponen</li><li>Berakar pada teori</li></ul></div><div class="bridge"><div class="lens"></div><div class="handle"></div><span class="mini">operasionalisasi</span></div><div class="definition-card operational"><h3>Operasional</h3><p>Keterlibatan diukur melalui skor angket yang mencakup perilaku, emosi, dan kognitif.</p><ul><li>Unit analisis: siswa SMP</li><li>Respons: skala 1–5</li><li>Skor: dimensi + total</li><li>Periode acuan: 4 pekan</li></ul></div></div>`},
      {title:'Dimensi dan Indikator',html:head(7,'Pohon konstruk','Teori → Dimensi → <span class="accent">Indikator</span>','Klik tiap dimensi untuk melihat bagaimana teori diterjemahkan menjadi tanda-tanda yang dapat ditanyakan.')+`<div class="tree-layout content"><div class="panel tree-menu" id="dimMenu" data-anim style="--d:240ms"><button class="dim-btn active" data-dim="0"><b>Perilaku</b><span>partisipasi yang tampak</span></button><button class="dim-btn" data-dim="1"><b>Emosi</b><span>perasaan terhadap belajar</span></button><button class="dim-btn" data-dim="2"><b>Kognitif</b><span>investasi strategi berpikir</span></button><div class="mini" style="padding:8px">Satu indikator dapat memerlukan lebih dari satu butir agar cakupan maknanya tidak terlalu sempit.</div></div><div class="panel tree-stage pulse" id="treeStage" data-anim style="--d:300ms"><span class="tree-root">KETERLIBATAN BELAJAR</span><span class="theory-chip">Fredricks et al. (2004)</span><div class="tree-branch"></div><div class="tree-detail"><h3 id="dimTitle">Dimensi perilaku</h3><p class="mini" id="dimDesc">Apa yang siswa lakukan selama proses belajar.</p><div class="indicator-list" id="indicatorList"><div class="indicator" style="--i:0">Berpartisipasi dalam diskusi</div><div class="indicator" style="--i:1">Menyelesaikan tugas</div><div class="indicator" style="--i:2">Bertanya saat belum paham</div><div class="indicator" style="--i:3">Mempertahankan usaha</div></div></div></div></div>`+note('Tiga dimensi contoh mengikuti sintesis konseptual keterlibatan sekolah <span class="body-note">(Fredricks et al., 2004)</span>; pemilihan indikator tetap perlu disesuaikan dengan konteks penelitian.')},
      {title:'Kisi-kisi Angket',html:head(8,'Peta sebelum menulis','Kisi-kisi Menjaga <span class="accent">Cakupan Konstruk</span>','Kisi-kisi menghubungkan teori, indikator, butir, arah pernyataan, dan rencana skoring sebelum angket diberikan.')+`<div class="blueprint-layout content" id="blueprint" data-anim style="--d:240ms"><table class="blueprint-table"><thead><tr><th>Dimensi</th><th>Indikator</th><th>Contoh butir</th><th>Arah</th><th>No.</th></tr></thead><tbody><tr><td><b>Perilaku</b></td><td>Partisipasi diskusi</td><td>Saya menyampaikan pendapat saat diskusi kelas.</td><td>+</td><td>1, 7</td></tr><tr><td><b>Perilaku</b></td><td>Penyelesaian tugas</td><td>Saya menunda tugas sampai melewati batas waktu.</td><td>−</td><td>2, 8</td></tr><tr><td><b>Emosi</b></td><td>Ketertarikan</td><td>Saya tertarik memahami alasan di balik materi.</td><td>+</td><td>3, 9</td></tr><tr><td><b>Kognitif</b></td><td>Strategi belajar</td><td>Saya menghubungkan materi baru dengan yang sudah dipahami.</td><td>+</td><td>4, 10</td></tr></tbody></table><div class="chip-bank"><button class="action" id="blueprintRun">▶ Susun butir</button><span class="move-chip">TEORI</span><span class="move-chip">INDIKATOR</span><span class="move-chip">BUTIR</span><span class="mini">Animasi menunjukkan komponen bergerak masuk ke kisi-kisi.</span></div></div>`},
      {title:'Menulis Butir',html:head(9,'Laboratorium butir','Satu Butir, <span class="accent">Satu Keputusan</span>','Butir yang baik spesifik, relevan terhadap indikator, mudah dipahami populasi sasaran, dan tidak menggiring jawaban.')+`<div class="item-lab content"><div class="panel item-index" id="itemTabs" data-anim style="--d:240ms"><button class="item-tab active" data-item="0"><b>Gagasan ganda</b><span>aktif + bahagia</span></button><button class="item-tab" data-item="1"><b>Kata absolut</b><span>selalu / tidak pernah</span></button><button class="item-tab" data-item="2"><b>Bahasa abstrak</b><span>“terlibat” tanpa perilaku</span></button><button class="item-tab" data-item="3"><b>Social desirability</b><span>jawaban “baik” terlalu jelas</span></button></div><div class="panel rewrite" id="rewrite" data-anim style="--d:300ms"><h3 id="rewriteTitle">Pisahkan dua gagasan</h3><div class="sentence bad" id="badSentence">Saya aktif dan bahagia dalam semua pembelajaran.</div><div class="sentence good" id="goodSentence">Saya menyampaikan pendapat saat diskusi kelas.</div><button class="action" id="revealRewrite">Geser ke versi lebih baik →</button><div class="principles"><span class="tag">spesifik</span><span class="tag">satu gagasan</span><span class="tag">periode jelas</span><span class="tag">bahasa responden</span><span class="tag">netral</span></div></div></div>`},
      {title:'Skala Respons',html:head(10,'Butir bertemu respons','Apa Arti Angka <span class="accent">1 sampai 5?</span>','Label respons harus cocok dengan bentuk pernyataan. Frekuensi, persetujuan, dan intensitas adalah keputusan pengukuran yang berbeda.')+`<div class="likert-stage content"><div class="cream-panel survey-card" data-anim style="--d:240ms"><span class="tag" style="color:#65431f;border-color:rgba(80,45,20,.2)">PILIH JAWABAN</span><div class="statement">“Dalam empat pekan terakhir, saya menyampaikan pendapat saat diskusi kelas.”</div><div class="scale-buttons" id="scaleButtons"><button class="scale-choice" data-value="1"><b>1</b>Tidak pernah</button><button class="scale-choice" data-value="2"><b>2</b>Jarang</button><button class="scale-choice active" data-value="3"><b>3</b>Kadang</button><button class="scale-choice" data-value="4"><b>4</b>Sering</button><button class="scale-choice" data-value="5"><b>5</b>Selalu</button></div><div class="response-output"><span class="stat" id="scaleValue" style="color:#54361b">3</span><span id="scaleMeaning">Respons menunjukkan frekuensi “kadang”, bukan nilai baik–buruk.</span></div><label class="reverse-switch"><input type="checkbox" id="reverseToggle"> Butir negatif: lakukan reverse coding (1↔5; 2↔4)</label></div><div class="panel likert-notes" data-anim style="--d:300ms"><h3>Tiga keputusan sebelum memilih skala</h3><div class="note"><b>Kontinum</b><span>Apa yang berubah dari rendah ke tinggi: frekuensi, persetujuan, kualitas, atau intensitas?</span></div><div class="note"><b>Label</b><span>Label verbal harus searah dan mudah dibedakan oleh responden.</span></div><div class="note"><b>Skoring</b><span>Dokumentasikan arah butir, skor hilang, dan cara membentuk skor dimensi/total.</span></div></div></div>`},
      {title:'Prates Angket',html:head(11,'Sebelum pengumpulan data utama','Baca, Tanyakan, <span class="accent">Uji Coba</span>','Instrumen tidak langsung disebarkan. Ia diperiksa oleh ahli, dipahami bersama calon responden, lalu diuji pada kelompok yang relevan.')+`<div class="pilot-layout content"><div class="visual pilot-visual" data-anim style="--d:240ms"><img src="${IMG.pilot}" alt="Kelompok peserta mengikuti uji coba angket"><span class="img-label">Uji coba pada populasi yang relevan</span></div><div class="panel pilot-panel" data-anim style="--d:300ms"><div class="stepper" id="pilotDots"><i class="step-dot active"></i><i class="step-dot"></i><i class="step-dot"></i></div><div class="pilot-detail"><div class="step-no" id="pilotNo">01</div><h3 id="pilotTitle">Telaah ahli</h3><p id="pilotText">Periksa kesesuaian indikator–butir, relevansi isi, bahasa, potensi bias, dan keterwakilan cakupan konstruk.</p><ul id="pilotList"><li>Ahli substansi</li><li>Ahli pengukuran/metode</li><li>Ahli bahasa bila diperlukan</li></ul></div><div class="pilot-nav"><span id="pilotStatus">Langkah 1 dari 3</span><button class="action" id="pilotNext">Lanjut →</button></div></div></div>`+note('Prates dan cognitive interviewing membantu menemukan perbedaan antara maksud peneliti dan cara responden memahami pertanyaan <span class="body-note">(Boateng et al., 2018)</span>.')},
      {title:'Merekap Data Angket',html:head(12,'Dari jawaban ke matriks','Jawaban Bergerak Menjadi <span class="accent">Data</span>','Rekap bukan sekadar mengetik angka: tentukan kode, reverse scoring, nilai hilang, dan rumus skor sebelum analisis.')+`<div class="coding-layout content"><div class="visual coding-visual" data-anim style="--d:240ms"><img src="${IMG.data}" alt="Peneliti merekap jawaban angket menjadi data"><span class="img-label">Rekap + pemeriksaan data</span></div><div class="panel coding-panel" id="codingPanel" data-anim style="--d:300ms"><span class="tag">RESPONDEN 014</span><div class="raw-responses"><span class="response-token">Sering</span><span class="response-token">Jarang</span><span class="response-token">Selalu</span><span class="response-token">Kadang</span></div><table class="data-table"><thead><tr><th>ID</th><th>I01</th><th>I02 (−)</th><th>I03</th><th>I04</th><th>Skor</th></tr></thead><tbody><tr><td>R014</td><td>4</td><td>4*</td><td>5</td><td>3</td><td>16</td></tr><tr><td>R015</td><td>3</td><td>2*</td><td>4</td><td>3</td><td>12</td></tr><tr><td>R016</td><td>5</td><td>5*</td><td>4</td><td>4</td><td>18</td></tr></tbody></table><div class="coding-tips"><button class="action" id="codingRun">▶ Rekap jawaban</button><span class="tag">* reverse coding</span><span class="tag">kode missing</span><span class="tag">cek rentang</span></div></div></div>`},
      {title:'Skala Data Angket',html:head(13,'Ordinal atau interval?','Jawabannya: <span class="accent">Tergantung Unit Analisis</span>','Jangan memberi satu label pada seluruh proses. Bedakan sifat satu respons dengan sifat skor gabungan yang dibentuk dari banyak butir.')+`<div class="scale-stage content" data-anim style="--d:240ms"><div class="panel scale-card"><span class="tag">SATU BUTIR</span><h3>Respons ordinal</h3><div class="ordinal-stack"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div><p>Urutan bermakna, tetapi jarak psikologis antara kategori belum otomatis sama.</p><div class="caution">Contoh: selisih pengalaman antara “jarang” dan “kadang” tidak harus identik dengan “sering” dan “selalu”.</div></div><div class="scale-arrow">→<span>digabung</span></div><div class="panel scale-card composite"><span class="tag">SKOR KOMPOSIT</span><h3>Jumlah / rerata beberapa butir</h3><div class="ordinal-stack"><span style="--n:0">1</span><span style="--n:1">2</span><span style="--n:2">3</span><span style="--n:3">4</span><span style="--n:4">5</span></div><p>Dapat diperlakukan mendekati kontinu bila konstruk, kualitas skala, distribusi, dan asumsi analisis mendukung—serta keputusan itu dijelaskan.</p><div class="caution">Bukan izin otomatis untuk semua uji parametrik.</div></div></div>`+note('Butir Likert tunggal bersifat ordinal; penggunaan skor gabungan perlu argumentasi, pemeriksaan asumsi, dan analisis yang sesuai <span class="body-note">(Sullivan & Artino, 2013)</span>.')},
      {title:'Validitas',html:head(14,'Apakah interpretasinya didukung?','Validitas Bukan Stempel. <span class="accent">Ia Argumen Berbasis Bukti.</span>','Pertanyaan utamanya bukan “apakah angket valid?”, tetapi apakah bukti mendukung interpretasi dan penggunaan skor yang direncanakan.')+`<div class="validity-layout content"><div class="visual validity-visual" data-anim style="--d:240ms"><img src="${IMG.validity}" alt="Metafora akurasi dan konsistensi instrumen"><span class="img-label">Akurat terhadap sasaran penggunaan</span></div><div class="panel evidence-panel" data-anim style="--d:300ms"><div class="evidence-hub" id="evidenceHub"><div class="hub-core">INTERPRETASI<br>+ PENGGUNAAN<br>SKOR</div><button class="evidence-btn active" data-evidence="0"><b>Isi</b>cakupan konstruk</button><button class="evidence-btn" data-evidence="1"><b>Proses respons</b>cara responden memahami</button><button class="evidence-btn" data-evidence="2"><b>Struktur internal</b>dimensi & pola hubungan</button><button class="evidence-btn" data-evidence="3"><b>Relasi eksternal</b>korelasi/prediksi</button><button class="evidence-btn" data-evidence="4"><b>Konsekuensi</b>dampak penggunaan</button></div><div class="evidence-detail" id="evidenceDetail"><b class="accent">Bukti isi:</b> ahli menilai relevansi, representasi, dan ketercakupan butir terhadap definisi konstruk.</div></div></div>`+note('Kerangka modern memandang validitas sebagai tingkat dukungan bukti dan teori terhadap interpretasi skor untuk penggunaan tertentu <span class="body-note">(AERA, APA, & NCME, 2014)</span>.')},
      {title:'Reliabilitas',html:head(15,'Apakah skornya konsisten?','Reliabilitas Menjawab <span class="accent">Konsistensi</span>','Konsistensi yang dibutuhkan bergantung pada desain: antarbutir, antarwaktu, atau antarpenilai. Reliabel belum tentu valid.')+`<div class="reliability-layout content"><div class="visual reliability-visual" data-anim style="--d:240ms"><img src="${IMG.validity}" alt="Timbangan dan anak panah sebagai metafora validitas dan reliabilitas"><span class="img-label">Konsisten ≠ otomatis tepat</span></div><div data-anim style="--d:300ms"><div class="meter-grid" id="meterGrid"><button class="meter active" data-meter="0"><div class="gauge"></div><b>Internal</b><span>α / ω</span></button><button class="meter" data-meter="1"><div class="gauge"></div><b>Test–retest</b><span>antarwaktu</span></button><button class="meter" data-meter="2"><div class="gauge"></div><b>Inter-rater</b><span>antarpenilai</span></button></div><div class="panel rel-detail" id="relDetail"><h3>Konsistensi antarbutir</h3><p>Alpha atau omega membantu menilai konsistensi skor komposit. Omega sering lebih sesuai ketika kontribusi butir tidak sama. Nilai tinggi tidak membuktikan satu dimensi atau validitas.</p></div><div class="caution"><b>Jangan mengejar angka dengan menghapus butir secara membabi buta.</b> Periksa teori, struktur faktor, redaksi, variasi respons, dan fungsi setiap butir.</div></div></div>`+note('Alpha tidak selalu merupakan estimasi reliabilitas terbaik; omega patut dipertimbangkan dan keduanya harus dibaca bersama model pengukuran <span class="body-note">(Hayes & Coutts, 2020)</span>.')},
      {title:'Kasus Populasi Sampel',cls:'chapter',html:`<div class="chapter-bg"><img src="${IMG.sample}" alt="Populasi sekolah dan kelompok sampel terpilih"></div><div class="chapter-copy"><div class="chapter-no" data-anim>02</div><div class="kicker" data-anim style="--d:110ms">Putaran 2 • Sampling</div><h2 data-anim style="--d:180ms">Dari Populasi Menjadi <span class="accent">Sampel</span></h2><p class="lead" data-anim style="--d:260ms">Peneliti ingin menggambarkan keterlibatan belajar siswa SMP di satu kabupaten—tanpa mewawancarai semua siswa.</p><div class="chapter-case" data-anim style="--d:350ms"><div><b>1.200</b><span>siswa dalam populasi terjangkau</span></div><div><b>12</b><span>sekolah dengan ukuran berbeda</span></div><div><b>?</b><span>siapa dipilih dan berapa banyak?</span></div></div></div>`},
      {title:'Istilah Sampling',html:head(17,'Peta istilah','Populasi Bukan Sekadar <span class="accent">“Semua Orang”</span>','Definisikan siapa yang ingin dijelaskan, siapa yang dapat dijangkau, dari daftar apa sampel dipilih, dan siapa yang akhirnya merespons.')+`<div class="universe-layout content"><div class="panel universe" data-anim style="--d:240ms"><div class="circle target"><div><b>Populasi target</b><span>semua unit yang ingin dijelaskan</span></div></div><div class="circle accessible"><div><b>Populasi terjangkau</b><span>unit yang dapat diakses</span></div></div><div class="circle sample-circle"><div><b>Sampel</b><span>unit terpilih</span></div></div></div><div class="terms" data-anim style="--d:300ms"><div class="panel term"><b>Unit analisis</b><span>Entitas yang menjadi dasar kesimpulan—misalnya siswa, guru, sekolah, atau UMKM.</span></div><div class="panel term"><b>Sampling frame</b><span>Daftar/kerangka operasional tempat unit dipilih.</span></div><div class="panel term"><b>Elemen sampel</b><span>Unit yang benar-benar masuk dalam pemilihan.</span></div><div class="panel term"><b>Responden</b><span>Pihak yang memberikan data; belum tentu identik dengan unit analisis.</span></div><div class="panel term"><b>Nonresponse</b><span>Unit terpilih tidak memberi data—potensial mengubah keterwakilan.</span></div></div></div>`},
      {title:'Sampel Menggambarkan Populasi',html:head(18,'Animasi representasi','Sampel Kecil, <span class="accent">Klaim Besar</span>','Klik cara pemilihan. Perhatikan bahwa jumlah sama tidak menjamin kualitas representasi yang sama.')+`<div class="population-layout content"><div class="visual population-visual" data-anim style="--d:240ms"><img src="${IMG.sample}" alt="Kelompok sampel berada di dalam populasi sekolah"><span class="img-label">Sampel tetap bagian dari populasi</span></div><div class="panel dot-panel" data-anim style="--d:300ms"><div class="dot-toolbar"><button class="btn active" data-dotmode="random">Pilih acak</button><button class="btn" data-dotmode="biased">Pilih satu sudut</button><button class="btn" data-dotmode="reset">Reset</button></div><div class="dot-field" id="dotField"></div><div class="bias-note"><span id="dotNote"><b>Acak:</b> peluang terpilih tidak ditentukan kedekatan atau kemudahan.</span><span id="dotCount">n = 16</span></div></div></div>`+note('Pada probability sampling, pemilihan berbasis randomisasi dan peluang seleksi dapat ditentukan; non-probability sampling tidak menyediakan dasar yang sama untuk menghitung sampling error <span class="body-note">(Statistics Canada, 2021)</span>.')},
      {title:'Probability Sampling',html:head(19,'Setiap unit punya peluang','Lima Desain <span class="accent">Probability Sampling</span>','Teknik dipilih berdasarkan struktur populasi, ketersediaan kerangka sampel, sebaran geografis, dan efisiensi pengumpulan data.')+`<div class="prob-grid" data-anim style="--d:240ms">${['Simple random|Setiap unit dipilih langsung secara acak.|Daftar lengkap diperlukan.','Systematic|Pilih titik awal acak, lalu setiap unit ke-k.|Waspadai pola periodik.','Stratified|Bagi populasi ke strata, lalu ambil dari setiap strata.|Menjamin keterwakilan subkelompok.','Cluster|Pilih kelompok alami, lalu teliti unit di dalam cluster.|Efisien, tetapi anggota cluster mirip.','Multistage|Pemilihan bertahap: wilayah → sekolah → siswa.|Cocok untuk populasi tersebar.'].map((x,j)=>{let a=x.split('|');let dots=Array.from({length:20},(_,i)=>`<i class="${(j===0?[1,5,8,14]:j===1?[1,5,9,13,17]:j===2?[1,4,6,9,12,16,19]:j===3?[5,6,9,10]:[2,7,12,17]).includes(i)?'on':''}"></i>`).join('');return `<div class="panel prob-card"><div class="mini-dots">${dots}</div><h3>${a[0]}</h3><p>${a[1]}</p><div class="trade">${a[2]}</div></div>`}).join('')}</div>`+note('Jenis desain probability sampling dan karakteristiknya dirangkum dari panduan sampling resmi <span class="body-note">(Statistics Canada, 2021)</span>.')},
      {title:'Simulasi Probability Sampling',html:head(20,'Lihat prosesnya','Teknik Berbeda, <span class="accent">Gerak Pemilihan Berbeda</span>','Jalankan empat simulasi pada populasi yang sama. Titik emas adalah unit yang terpilih.')+`<div class="sim-layout content"><div class="panel sim-menu" id="simMenu" data-anim style="--d:240ms"><button class="sim-btn active" data-sim="srs"><b>Simple random</b><span>acak dari seluruh daftar</span></button><button class="sim-btn" data-sim="systematic"><b>Systematic</b><span>setiap unit ke-k</span></button><button class="sim-btn" data-sim="stratified"><b>Stratified</b><span>ambil dari tiap strata</span></button><button class="sim-btn" data-sim="cluster"><b>Cluster</b><span>pilih kelompok utuh</span></button><button class="action" id="simRun">▶ Jalankan ulang</button></div><div class="panel sim-stage" data-anim style="--d:300ms"><div class="school-labels"><span>Sekolah A</span><span>Sekolah B</span><span>Sekolah C</span><span>Sekolah D</span></div><div class="sim-dots" id="simDots"></div><div class="panel sim-caption"><span id="simCaption">Setiap siswa dipilih dari seluruh daftar menggunakan angka acak.</span><b id="simSelected" class="accent">16 terpilih</b></div></div></div>`},
      {title:'Non-probability Sampling',html:head(21,'Cepat, berguna, tetapi terbatas','Kapan Pemilihan Tidak Acak <span class="accent">Masih Berguna?</span>','Klik teknik untuk melihat fungsi dan risikonya. Keterbatasan generalisasi harus dinyatakan secara jujur.')+`<div class="nonprob-grid" id="nonprobGrid" data-anim style="--d:240ms">${[['◎','Convenience','Unit yang paling mudah dijangkau.','Bias akses tinggi.'],['⌖','Purposive','Unit dipilih karena kriteria khusus.','Bergantung pertimbangan peneliti.'],['▦','Quota','Penuhi jumlah per kategori tanpa randomisasi.','Kuota tidak menghapus bias seleksi.'],['⛓','Snowball','Responden merujuk responden lain.','Jaringan awal memengaruhi sampel.'],['⇥','Consecutive','Ambil semua unit memenuhi kriteria selama periode tertentu.','Terikat tempat dan waktu.']].map((x,i)=>`<button class="panel nonprob ${i===0?'active':''}" data-nonprob="${i}"><span class="ico">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p><div class="risk">${x[3]}</div></button>`).join('')}</div><div class="panel nonprob-detail" id="nonprobDetail"><span class="stat">!</span><p><b class="accent">Convenience:</b> berguna untuk eksplorasi awal atau akses terbatas, tetapi tidak otomatis mewakili populasi target.</p></div>`+note('Karena probabilitas inklusi tidak diketahui, non-probability sampling tidak memberi dasar langsung untuk estimasi sampling error dan klaim representasi perlu dibatasi <span class="body-note">(Statistics Canada, 2021)</span>.')},
      {title:'Memilih Teknik Sampling',html:head(22,'Pohon keputusan praktis','Desain Sampling Mengikuti <span class="accent">Kondisi Lapangan</span>','Jawab tiga kondisi berikut. Rekomendasi akan bergerak mengikuti jawaban—tetapi keputusan akhir tetap memerlukan argumen metodologis.')+`<div class="decision-layout content"><div class="panel decision-panel" data-anim style="--d:240ms"><div class="decision-q"><b>1. Apakah tersedia kerangka sampel yang cukup lengkap?</b><div class="toggle-row"><button class="choice active" data-q="frame" data-v="yes">Ya</button><button class="choice" data-q="frame" data-v="no">Tidak</button></div></div><div class="decision-q"><b>2. Apakah subkelompok penting harus terwakili?</b><div class="toggle-row"><button class="choice active" data-q="groups" data-v="yes">Ya</button><button class="choice" data-q="groups" data-v="no">Tidak</button></div></div><div class="decision-q"><b>3. Apakah populasi tersebar di banyak lokasi?</b><div class="toggle-row"><button class="choice" data-q="spread" data-v="yes">Ya</button><button class="choice active" data-q="spread" data-v="no">Tidak</button></div></div><div class="decision-q"><b>4. Tujuan utama?</b><div class="toggle-row"><button class="choice active" data-q="aim" data-v="infer">Inferensi populasi</button><button class="choice" data-q="aim" data-v="special">Kasus khusus/sulit dijangkau</button></div></div></div><div class="cream-panel recommend" data-anim style="--d:300ms"><span class="tag" style="width:max-content;color:#62411f;border-color:rgba(80,45,20,.2)">REKOMENDASI AWAL</span><div class="route" id="routeTitle">Stratified random sampling</div><p id="routeText">Gunakan strata yang relevan—misalnya sekolah atau jenjang—lalu lakukan pemilihan acak di tiap strata.</p><div class="warning" id="routeWarn">Pastikan alokasi proporsional atau jelaskan alasan oversampling.</div></div></div>`},
      {title:'Penentu Ukuran Sampel',html:head(23,'Bukan satu angka universal','Ukuran Sampel Ditentukan oleh <span class="accent">Tujuan + Desain</span>','Klik faktor untuk melihat dampaknya. Angka yang sama bisa memadai untuk estimasi sederhana, tetapi lemah untuk model atau subkelompok yang kompleks.')+`<div class="factors" id="factorGrid" data-anim style="--d:240ms">${[['Tujuan analisis','Estimasi proporsi, korelasi, regresi, perbandingan kelompok, atau model laten.','82%'],['Ukuran populasi','Berpengaruh melalui finite population correction ketika populasi terbatas.','45%'],['Confidence level','Semakin tinggi keyakinan, biasanya semakin besar sampel.','72%'],['Margin of error','Semakin kecil toleransi galat, sampel meningkat tajam.','95%'],['Variabilitas / p','p = .50 menghasilkan kebutuhan maksimum untuk proporsi.','67%'],['Effect size + power','Efek lebih kecil memerlukan sampel lebih besar agar terdeteksi.','91%'],['Desain sampling','Cluster dapat membutuhkan design effect; stratifikasi dapat meningkatkan presisi.','78%'],['Nonresponse','Jumlah undangan harus melebihi jumlah respons yang dibutuhkan.','58%']].map((x,i)=>`<button class="panel factor ${i===0?'active':''}" data-factor="${i}" style="--power:${x[2]}"><b>${x[0]}</b><span>${x[1]}</span></button>`).join('')}</div><div class="panel factor-detail" id="factorDetail"><b class="accent">Tujuan analisis:</b> mulai dari parameter atau pengujian utama—bukan dari angka populer.</div>`},
      {title:'Metode Ukuran Sampel',html:head(24,'Rumus harus punya konteks','Pilih Metode Berdasarkan <span class="accent">Pertanyaan</span>','Rumus estimasi proporsi tidak menggantikan power analysis untuk uji hipotesis atau model yang menjadi analisis utama.')+`<div class="formula-layout content"><div class="panel formula-menu" id="formulaMenu" data-anim style="--d:240ms"><button class="formula-tab active" data-formula="0"><b>Cochran</b><span>estimasi proporsi</span></button><button class="formula-tab" data-formula="1"><b>Finite population correction</b><span>populasi terbatas</span></button><button class="formula-tab" data-formula="2"><b>Krejcie–Morgan</b><span>tabel/rumus proporsi</span></button><button class="formula-tab" data-formula="3"><b>Power analysis</b><span>uji hipotesis/model</span></button><button class="formula-tab" data-formula="4"><b>Penyesuaian nonresponse</b><span>jumlah undangan</span></button></div><div class="cream-panel formula-paper" id="formulaPaper" data-anim style="--d:300ms"><span class="tag" style="color:#66431f;border-color:rgba(80,45,20,.2)" id="formulaTag">Estimasi proporsi</span><h3 id="formulaTitle">Cochran untuk populasi besar</h3><div class="formula" id="formulaMath">n₀ = z²p(1−p) / e²</div><p id="formulaText">Gunakan ketika sasaran utama adalah mengestimasi proporsi dengan confidence level dan margin of error tertentu.</p><div class="formula-vars" id="formulaVars"><span>z = skor confidence</span><span>p = proporsi dugaan</span><span>e = margin of error</span></div><div class="critical" id="formulaCritical"><b>Catatan:</b> asumsi simple random sampling. Desain cluster, pembobotan, dan analisis kompleks memerlukan penyesuaian.</div></div></div>`+note('Krejcie–Morgan menyediakan pendekatan ukuran sampel untuk populasi terbatas; power analysis mengaitkan sampel dengan efek, α, power, dan jenis uji <span class="body-note">(Krejcie & Morgan, 1970; Faul et al., 2009)</span>.')},
      {title:'Kalkulator Sampel',html:head(25,'Contoh hitung interaktif','Dari 1.200 Siswa, <span class="accent">Berapa Sampel?</span>','Geser parameter. Kalkulator memakai Cochran untuk proporsi, koreksi populasi terbatas, lalu menambah undangan untuk mengantisipasi nonresponse.')+`<div class="calculator content"><div class="panel controls-card" data-anim style="--d:240ms"><div class="control-row"><label for="popRange">Populasi (N)</label><input id="popRange" type="range" min="100" max="5000" step="50" value="1200"><output id="popOut">1.200</output></div><div class="control-row"><label for="confSelect">Confidence level</label><select id="confSelect"><option value="1.645">90%</option><option value="1.96" selected>95%</option><option value="2.576">99%</option></select><output id="confOut">z=1,96</output></div><div class="control-row"><label for="errorRange">Margin of error (e)</label><input id="errorRange" type="range" min="2" max="10" step="0.5" value="5"><output id="errorOut">5%</output></div><div class="control-row"><label for="pRange">Proporsi dugaan (p)</label><input id="pRange" type="range" min="10" max="90" step="5" value="50"><output id="pOut">0,50</output></div><div class="control-row"><label for="responseRange">Respons diharapkan</label><input id="responseRange" type="range" min="50" max="100" step="5" value="80"><output id="responseOut">80%</output></div><div class="caution"><b>Jika sampling cluster:</b> terapkan design effect dan pertimbangkan jumlah cluster—bukan hanya jumlah individu.</div></div><div class="cream-panel result-card" data-anim style="--d:300ms"><div class="result-grid"><div class="result"><span>Cochran, populasi besar</span><b id="n0Result">385</b></div><div class="result"><span>Setelah koreksi N</span><b id="nResult">292</b></div><div class="result primary"><span>Jumlah minimal undangan</span><b id="inviteResult">365</b></div></div><p class="result-note" id="calcNote">Dengan N=1.200, confidence 95%, e=5%, p=.50, dibutuhkan sekitar 292 respons. Jika respons diperkirakan 80%, undang minimal 365 siswa.</p></div></div>`+note('Kalkulator merupakan demonstrasi untuk estimasi proporsi dengan asumsi simple random sampling; kebutuhan akhir harus mengikuti desain dan analisis utama penelitian.')},
      {title:'Mitos Minimal 30',html:head(26,'Kaidah atau kebiasaan?','“Yang Penting Minimal 30” <span class="red">Bukan Aturan Universal</span>','Tiga puluh dapat muncul sebagai aturan praktis dalam konteks tertentu, tetapi tidak menjawab presisi, power, jumlah prediktor, kelompok, cluster, atau nonresponse.')+`<div class="myth-layout content"><div class="cream-panel myth-card" data-anim style="--d:240ms"><div class="n30">n = 30</div><h3>Bisa cukup. Bisa juga sangat kurang.</h3><p>Pertanyaan yang benar: <b>cukup untuk tujuan analisis apa, dengan asumsi apa, dan risiko kesalahan berapa?</b></p></div><div class="panel precision-panel" data-anim style="--d:300ms"><span class="tag">SIMULASI PRESISI • p=.50 • 95%</span><div class="n-switches" id="nSwitches"><button class="n-btn active" data-n="30">n=30</button><button class="n-btn" data-n="100">n=100</button><button class="n-btn" data-n="292">n=292</button><button class="n-btn" data-n="500">n=500</button></div><div class="moe-viz"><div class="error-band" id="errorBand" style="--h:235px"></div></div><div class="moe-text">Margin of error sekitar <b id="moeValue">±17,9%</b><p class="mini" id="moeMeaning">Rentang terlalu lebar untuk banyak keputusan praktis.</p></div></div></div>`},
      {title:'Rangkuman',html:head(27,'Refleksi akhir','Satu Rantai, Dua Sumber <span class="accent">Kualitas Data</span>','Kualitas penelitian kuantitatif ditentukan bersama oleh kualitas instrumen dan kualitas pemilihan unit yang menghasilkan data.')+`<div class="summary-map" data-anim style="--d:240ms"><div class="summary-line"></div><div class="summary-steps">${[['📚','Teori','batas konstruk'],['◇','Definisi','operasional'],['▦','Kisi-kisi','cakupan'],['✎','Butir','respons'],['✓','Bukti','valid + reliabel'],['●','Sampel','representasi'],['▥','Data','analisis']].map(x=>`<div class="summary-step"><div class="orb">${x[0]}</div><b>${x[1]}</b><span>${x[2]}</span></div>`).join('')}</div><div class="cream-panel summary-question">Apakah skor mengukur konstruk yang dimaksud—dan apakah sampel mendukung klaim terhadap populasi?</div></div>`},
      {title:'Bibliografi',html:head(28,'Daftar rujukan • dapat diklik','Baca Sumbernya, <span class="accent">Periksa Argumennya</span>','Klik judul untuk membuka artikel, standar, atau panduan asli. Pilih tab instrumen atau sampling.')+`<div class="refs-tabs" id="refsTabs" data-anim style="--d:220ms"><button class="btn active" data-ref="instrument">Instrumen & pengukuran</button><button class="btn" data-ref="sampling">Sampling & ukuran sampel</button></div><div class="refs-grid" id="refsGrid" data-anim style="--d:280ms"></div><div class="closing-line" data-anim style="--d:380ms"><div class="thanks">Rujukan bukan ornamen—ia dasar keputusan metodologis.</div><div class="signature"><strong>Metodologi Penelitian Kuantitatif • Bagian 2</strong><br>INISNU Temanggung</div></div>`},
      {title:'Penutup',cls:'closing',html:`<div><div class="seal" data-anim>Σ</div><h2 data-anim style="--d:160ms">Instrumen yang Jelas.<br><span class="accent">Sampel yang Beralasan.</span></h2><p data-anim style="--d:260ms">Dari sana, data kuantitatif mulai memiliki makna.</p><div class="sig" data-anim style="--d:360ms"><b>Najib Mubarok, M.Sc.</b><br>INISNU Temanggung</div></div>`}
    ];
    const scenesEl=document.getElementById('scenes');
    scenesEl.innerHTML=slides.map((s,i)=>`<section class="scene ${i===0?'active ':''}${s.cls||''}" id="s${i+1}" data-title="${s.title}" aria-label="${s.title}">${s.html}</section>`).join('');

    const deck=document.getElementById('deck'),shell=document.getElementById('shell'),scenes=[...document.querySelectorAll('.scene')];let current=0,switching=false,paused=false,soundOn=false,audioCtx=null;const resetters={};
    function fit(){let root=document.documentElement,vv=window.visualViewport,w=root.clientWidth||innerWidth||1600,h=root.clientHeight||innerHeight||900;if(vv&&vv.width&&vv.height){w=Math.min(w,vv.width);h=Math.min(h,vv.height)}let gap=document.fullscreenElement?6:12,scale=Math.min((w-gap*2)/1600,(h-gap*2)/900);if(!isFinite(scale)||scale<=0)scale=1;deck.style.transform=`translate(-50%,-50%) scale(${scale})`}
    function scheduleFit(){fit();requestAnimationFrame(()=>{fit();requestAnimationFrame(fit)});setTimeout(fit,120);setTimeout(fit,360)}window.addEventListener('resize',scheduleFit);window.addEventListener('orientationchange',scheduleFit);document.addEventListener('fullscreenchange',scheduleFit);if(window.visualViewport)visualViewport.addEventListener('resize',scheduleFit);scheduleFit();
    function tone(freq=440,d=.09){if(!soundOn)return;try{audioCtx=audioCtx||new(AudioContext||webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.035,audioCtx.currentTime+.012);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d+.02)}catch(e){}}
    function updateUI(){counter.textContent=String(current+1).padStart(2,'0')+' / '+String(scenes.length).padStart(2,'0');progressBar.style.width=((current+1)/scenes.length*100)+'%';prevBtn.disabled=current===0;nextBtn.disabled=current===scenes.length-1;document.title=slides[current].title+' — Metodologi Penelitian Kuantitatif Bagian 2'}
    function replay(scene){scene.querySelectorAll('[data-anim]').forEach(el=>{el.style.animation='none';void el.offsetWidth;el.style.animation=''})}
    function goTo(index){index=Math.max(0,Math.min(scenes.length-1,index));if(index===current||switching)return;switching=true;let old=scenes[current],next=scenes[index],forward=index>current;old.classList.add(forward?'leaving-next':'leaving-prev');old.classList.remove('active','from-left');current=index;next.classList.toggle('from-left',!forward);next.classList.add('active');replay(next);updateUI();tone(forward?520:390);setTimeout(()=>{old.classList.remove('leaving-next','leaving-prev');switching=false},390)}
    prevBtn.onclick=()=>goTo(current-1);nextBtn.onclick=()=>goTo(current+1);
    function togglePause(){paused=!paused;deck.classList.toggle('paused',paused);document.getAnimations().forEach(a=>{try{paused?a.pause():a.play()}catch(e){}});pauseBtn.textContent=paused?'▶':'Ⅱ';pauseBtn.classList.toggle('active',paused)}pauseBtn.onclick=togglePause;
    soundBtn.onclick=function(){soundOn=!soundOn;this.classList.toggle('active',soundOn);if(soundOn)tone(620,.13)};
    fullBtn.onclick=()=>{if(!document.fullscreenElement){let p=shell.requestFullscreen?shell.requestFullscreen():Promise.resolve();if(p&&p.then)p.then(scheduleFit).catch(()=>{})}else if(document.exitFullscreen)document.exitFullscreen().then(scheduleFit).catch(()=>{})};
    const help=document.getElementById('help');function toggleHelp(force){let open=typeof force==='boolean'?force:!help.classList.contains('open');help.classList.toggle('open',open)}helpBtn.onclick=()=>toggleHelp();closeHelp.onclick=()=>toggleHelp(false);help.onclick=e=>{if(e.target===help)toggleHelp(false)};
    function resetScene(){replay(scenes[current]);if(resetters[current])resetters[current]();tone(460)}resetBtn.onclick=resetScene;
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&help.classList.contains('open')){toggleHelp(false);return}if(help.classList.contains('open'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();goTo(current+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();goTo(current-1)}else if(e.key===' '){e.preventDefault();togglePause()}else if(e.key.toLowerCase()==='r')resetScene();else if(e.key.toLowerCase()==='f')fullBtn.click();else if(e.key.toLowerCase()==='m')soundBtn.click();else if(e.key==='?'||(e.shiftKey&&e.key==='/'))toggleHelp()});let touchX=null;deck.addEventListener('touchstart',e=>touchX=e.touches[0].clientX,{passive:true});deck.addEventListener('touchend',e=>{if(touchX===null)return;let d=e.changedTouches[0].clientX-touchX;touchX=null;if(Math.abs(d)>90)goTo(current+(d<0?1:-1))},{passive:true});

    // Scene 2
    const badData=[['Dua gagasan dalam satu butir','“Aktif” dan “bahagia” dapat menghasilkan dua jawaban berbeda. Satu butir sebaiknya meminta satu keputusan.'],['Konstruk bergeser','Butir lebih banyak menilai kualitas guru daripada keterlibatan siswa sebagai variabel yang hendak diukur.'],['Negasi ganda','“Bukan” + “tidak pernah” meningkatkan beban kognitif dan rawan dibaca terbalik.'],['Belum operasional','Kata “terlibat” hanya mengulang nama konstruk; belum menunjukkan perilaku, emosi, atau strategi yang dapat dijawab.']];document.querySelectorAll('.bad-item').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.bad-item').forEach(x=>x.classList.remove('active'));b.classList.add('active');badDiagnosis.animate([{opacity:.2,transform:'translateX(20px)'},{opacity:1,transform:'none'}],{duration:380});badDiagnosis.innerHTML=`<strong>${badData[i][0]}</strong><p>${badData[i][1]}</p>`;tone(470+i*40)});
    // Scene 3
    const clinic=[['“Saya selalu aktif dan bahagia mengikuti semua pelajaran.”','<b class="accent">Perbaikan:</b> pecah menjadi “Saya mengajukan pertanyaan ketika materi belum saya pahami” dan butir emosi yang terpisah.'],['“Guru saya mengajar dengan baik sehingga saya rajin belajar.”','<b class="accent">Perbaikan:</b> jika konstruknya keterlibatan siswa, tanyakan perilaku siswa—bukan kualitas guru.'],['“Saya bukan siswa yang tidak pernah mengabaikan tugas.”','<b class="accent">Perbaikan:</b> “Saya menyelesaikan tugas sebelum batas waktu.” Gunakan struktur langsung.'],['“Saya terlibat dalam pembelajaran.”','<b class="accent">Perbaikan:</b> nyatakan indikator: “Saya menyampaikan pendapat saat diskusi kelas.”']];document.querySelectorAll('.tool').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');patientQuote.textContent=clinic[i][0];clinicResult.innerHTML=clinic[i][1];patientQuote.animate([{opacity:.25,transform:'translateY(18px)'},{opacity:1,transform:'none'}],{duration:420});tone(490+i*45)});
    // Scene 5
    const strategies=[['Adopsi bukan “salin-tempel”.','Pastikan izin, bahasa, populasi, skoring, dan bukti penggunaan sebelumnya tetap relevan.'],['Adaptasi memerlukan bukti baru.','Terjemahan, perubahan konteks, atau penggantian butir dapat mengubah cara skor bekerja.'],['Instrumen baru membutuhkan proses penuh.','Bangun domain isi, hasilkan butir, lakukan prates, evaluasi struktur, reliabilitas, dan bukti validitas.']];document.querySelectorAll('.strategy').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.strategy').forEach(x=>x.classList.remove('active'));b.classList.add('active');strategyOutput.animate([{opacity:.25,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:400});strategyOutput.innerHTML=`<span class="stat">${i===0?'✓':i===1?'↻':'+'}</span><p><b>${strategies[i][0]}</b> ${strategies[i][1]}</p>`;tone(510+i*50)});
    // Scene 7
    const dims=[['Dimensi perilaku','Apa yang siswa lakukan selama proses belajar.',['Berpartisipasi dalam diskusi','Menyelesaikan tugas','Bertanya saat belum paham','Mempertahankan usaha']],['Dimensi emosi','Bagaimana perasaan dan keterikatan siswa terhadap kegiatan belajar.',['Merasa tertarik','Merasa menjadi bagian kelas','Menikmati tantangan belajar','Menunjukkan emosi positif']],['Dimensi kognitif','Bagaimana siswa menginvestasikan strategi dan pemikiran.',['Menghubungkan konsep','Memonitor pemahaman','Menggunakan strategi belajar','Mengevaluasi solusi']]];document.querySelectorAll('.dim-btn').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.dim-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');dimTitle.textContent=dims[i][0];dimDesc.textContent=dims[i][1];indicatorList.innerHTML=dims[i][2].map((x,j)=>`<div class="indicator" style="--i:${j}">${x}</div>`).join('');treeStage.classList.remove('pulse');void treeStage.offsetWidth;treeStage.classList.add('pulse');tone(480+i*55)});
    // Scene 8
    blueprintRun.onclick=()=>{blueprint.classList.remove('running');void blueprint.offsetWidth;blueprint.classList.add('running');tone(650,.16)};resetters[7]=()=>blueprint.classList.remove('running');
    // Scene 9
    const rewrites=[['Pisahkan dua gagasan','Saya aktif dan bahagia dalam semua pembelajaran.','Saya menyampaikan pendapat saat diskusi kelas.'],['Hindari kata absolut','Saya selalu menyelesaikan setiap tugas dengan sempurna.','Dalam empat pekan terakhir, saya menyelesaikan tugas sebelum batas waktu.'],['Ganti abstraksi dengan perilaku','Saya terlibat dalam pembelajaran.','Saya bertanya ketika ada bagian materi yang belum saya pahami.'],['Kurangi jawaban yang “terlihat baik”','Saya adalah siswa teladan yang selalu peduli pada belajar.','Saya meninjau kembali catatan sebelum pertemuan berikutnya.']];function setRewrite(i){rewrite.classList.remove('revealed');rewriteTitle.textContent=rewrites[i][0];badSentence.textContent=rewrites[i][1];goodSentence.textContent=rewrites[i][2]}document.querySelectorAll('.item-tab').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.item-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');setRewrite(i);tone(470+i*45)});revealRewrite.onclick=()=>{rewrite.classList.toggle('revealed');tone(630,.12)};resetters[8]=()=>setRewrite(0);
    // Scene 10
    document.querySelectorAll('.scale-choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.scale-choice').forEach(x=>x.classList.remove('active'));b.classList.add('active');let v=+b.dataset.value,r=reverseToggle.checked?6-v:v;scaleValue.textContent=r;scaleMeaning.textContent=reverseToggle.checked?`Respons ${v} dibalik menjadi ${r} karena butir berarah negatif.`:`Respons menunjukkan kategori “${b.textContent.replace(v,'').trim()}”, bukan nilai baik–buruk.`;b.animate([{transform:'translateY(-12px) scale(1.06)'},{transform:'translateY(-5px) scale(1)'}],{duration:380});tone(430+v*45)});reverseToggle.onchange=()=>document.querySelector('.scale-choice.active').click();
    // Scene 11
    const pilot=[['Telaah ahli','Periksa kesesuaian indikator–butir, relevansi isi, bahasa, potensi bias, dan keterwakilan cakupan konstruk.',['Ahli substansi','Ahli pengukuran/metode','Ahli bahasa bila diperlukan']],['Cognitive interview','Minta calon responden menjelaskan bagaimana mereka memahami, mengingat, menilai, dan memilih jawaban.',['Think-aloud / probing','Catat kata yang ambigu','Perbaiki proses respons']],['Pilot test','Uji pada kelompok yang menyerupai populasi sasaran untuk menilai distribusi jawaban, performa butir, struktur, dan reliabilitas awal.',['Cek missing dan pola ekstrem','Analisis butir','Revisi sebelum studi utama']]];let pilotI=0;function renderPilot(){let p=pilot[pilotI];pilotNo.textContent=String(pilotI+1).padStart(2,'0');pilotTitle.textContent=p[0];pilotText.textContent=p[1];pilotList.innerHTML=p[2].map(x=>`<li>${x}</li>`).join('');pilotStatus.textContent=`Langkah ${pilotI+1} dari 3`;pilotNext.textContent=pilotI===2?'Ulangi ↺':'Lanjut →';document.querySelectorAll('.step-dot').forEach((d,i)=>{d.classList.toggle('active',i===pilotI);d.classList.toggle('done',i<pilotI)});document.querySelector('.pilot-detail').animate([{opacity:.2,transform:'translateX(24px)'},{opacity:1,transform:'none'}],{duration:420})}pilotNext.onclick=()=>{pilotI=(pilotI+1)%3;renderPilot();tone(510+pilotI*55)};resetters[10]=()=>{pilotI=0;renderPilot()};
    // Scene 12
    codingRun.onclick=()=>{codingPanel.classList.remove('running');void codingPanel.offsetWidth;codingPanel.classList.add('running');tone(660,.16)};resetters[11]=()=>codingPanel.classList.remove('running');
    // Scene 14
    const evidence=['<b class="accent">Bukti isi:</b> ahli menilai relevansi, representasi, dan ketercakupan butir terhadap definisi konstruk.','<b class="accent">Proses respons:</b> periksa apakah responden memahami dan menjawab sesuai proses yang dimaksud.','<b class="accent">Struktur internal:</b> analisis hubungan antarbutir dan dimensi, misalnya EFA/CFA bila sesuai.','<b class="accent">Relasi eksternal:</b> skor menunjukkan pola hubungan atau prediksi yang selaras dengan teori.','<b class="accent">Konsekuensi:</b> pertimbangkan dampak yang diharapkan maupun tidak diharapkan dari penggunaan skor.'];document.querySelectorAll('.evidence-btn').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.evidence-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');evidenceDetail.innerHTML=evidence[i];evidenceDetail.animate([{opacity:.2,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:350});tone(480+i*40)});
    // Scene 15
    const rels=[['Konsistensi antarbutir','Alpha atau omega membantu menilai konsistensi skor komposit. Omega sering lebih sesuai ketika kontribusi butir tidak sama. Nilai tinggi tidak membuktikan satu dimensi atau validitas.'],['Stabilitas antarwaktu','Test–retest menilai kestabilan skor ketika konstruk diperkirakan relatif tetap. Jarak waktu harus cukup agar tidak sekadar mengingat, tetapi tidak terlalu lama hingga konstruk berubah.'],['Kesepakatan antarpenilai','Digunakan ketika skor bergantung pada observasi atau rubrik. Latihan penilai dan definisi kategori penting; pilih koefisien yang sesuai jenis data.']];document.querySelectorAll('.meter').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.meter').forEach(x=>x.classList.remove('active'));b.classList.add('active');relDetail.innerHTML=`<h3>${rels[i][0]}</h3><p>${rels[i][1]}</p>`;relDetail.animate([{opacity:.2,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:380});tone(470+i*55)});
    // Scene 18 population dots
    const dotField=document.getElementById('dotField');dotField.innerHTML=Array.from({length:84},(_,i)=>`<i class="person-dot group-${i%3===0?'a':i%3===1?'b':'c'}"></i>`).join('');const dots=[...dotField.children];function selectDots(mode){dots.forEach(d=>d.classList.remove('selected','dimmed'));let indices=[];if(mode==='random'){indices=[1,5,9,14,18,23,27,31,38,43,49,54,61,66,73,80];dotNote.innerHTML='<b>Acak:</b> peluang terpilih tidak ditentukan kedekatan atau kemudahan.'}else if(mode==='biased'){indices=[0,1,2,3,4,12,13,14,15,16,24,25,26,27,28,36];dotNote.innerHTML='<b>Bias:</b> jumlah sama, tetapi pilihan menumpuk pada satu wilayah/kelompok.'}else{dotNote.innerHTML='<b>Populasi:</b> pilih cara sampling untuk melihat sampel.';dotCount.textContent='N = 84';return}dots.forEach((d,i)=>{if(indices.includes(i))setTimeout(()=>d.classList.add('selected'),indices.indexOf(i)*35);else d.classList.add('dimmed')});dotCount.textContent='n = '+indices.length;tone(mode==='random'?620:390,.13)}document.querySelectorAll('[data-dotmode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-dotmode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectDots(b.dataset.dotmode)});selectDots('random');resetters[17]=()=>{document.querySelector('[data-dotmode="random"]').click()};
    // Scene 20 simulator
    const simDots=document.getElementById('simDots');simDots.innerHTML=Array.from({length:80},(_,i)=>`<i class="s${Math.floor(i/20)+1}"></i>`).join('');let simMode='srs';const simTexts={srs:'Setiap siswa dipilih dari seluruh daftar menggunakan angka acak.',systematic:'Titik awal dipilih acak, lalu setiap siswa ke-5 masuk sampel.',stratified:'Dari setiap sekolah dipilih empat siswa secara acak.',cluster:'Dua sekolah dipilih; semua siswa di cluster terpilih diikutkan.'};function runSim(){let ds=[...simDots.children],idx=[];ds.forEach(d=>d.classList.remove('selected'));if(simMode==='srs')idx=[2,6,11,15,20,25,31,34,41,46,50,56,63,69,73,78];if(simMode==='systematic')idx=Array.from({length:16},(_,i)=>2+i*5);if(simMode==='stratified')idx=[1,6,12,18,22,27,34,39,41,48,53,59,62,67,74,78];if(simMode==='cluster')idx=Array.from({length:40},(_,i)=>i+20);idx.forEach((n,i)=>setTimeout(()=>ds[n].classList.add('selected'),i*25));simCaption.textContent=simTexts[simMode];simSelected.textContent=idx.length+' terpilih';tone(620,.14)}document.querySelectorAll('.sim-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sim-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');simMode=b.dataset.sim;runSim()});simRun.onclick=runSim;runSim();resetters[19]=()=>{simMode='srs';document.querySelector('.sim-btn').click()};
    // Scene 21
    const nonprobText=[['Convenience','berguna untuk eksplorasi awal atau akses terbatas, tetapi tidak otomatis mewakili populasi target.'],['Purposive','tepat ketika informasi hanya dimiliki unit dengan kriteria tertentu; kriteria dan logika pemilihan harus transparan.'],['Quota','menjaga komposisi kategori yang ditentukan, tetapi pemilihan di dalam kategori tetap tidak acak.'],['Snowball','membantu menjangkau populasi tersembunyi atau berjejaring; hasil dapat dipengaruhi struktur jaringan awal.'],['Consecutive','lebih sistematis daripada convenience karena semua unit eligible selama periode diambil, tetapi masih terikat lokasi dan waktu.']];document.querySelectorAll('.nonprob').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.nonprob').forEach(x=>x.classList.remove('active'));b.classList.add('active');nonprobDetail.innerHTML=`<span class="stat">${i+1}</span><p><b class="accent">${nonprobText[i][0]}:</b> ${nonprobText[i][1]}</p>`;nonprobDetail.animate([{opacity:.2,transform:'translateX(18px)'},{opacity:1,transform:'none'}],{duration:380});tone(470+i*40)});
    // Scene 22 decision
    const decision={frame:'yes',groups:'yes',spread:'no',aim:'infer'};function renderRoute(){let title,text,warn;if(decision.aim==='special'){title=decision.frame==='no'?'Purposive / snowball':'Purposive sampling';text='Fokuskan pemilihan pada unit yang benar-benar memiliki karakteristik atau pengalaman yang dibutuhkan.';warn='Batasi klaim; jelaskan kriteria, jalur rekrutmen, dan potensi bias.'}else if(decision.frame==='no'&&decision.spread==='yes'){title='Multistage / cluster';text='Bangun pemilihan bertahap dari kelompok yang kerangkanya tersedia, lalu pilih unit di dalamnya.';warn='Perhitungkan design effect dan bobot bila peluang seleksi berbeda.'}else if(decision.groups==='yes'){title='Stratified random sampling';text='Gunakan strata yang relevan—misalnya sekolah atau jenjang—lalu lakukan pemilihan acak di tiap strata.';warn='Pastikan alokasi proporsional atau jelaskan alasan oversampling.'}else if(decision.spread==='yes'){title='Cluster sampling';text='Pilih cluster geografis/organisasi untuk menekan biaya, lalu teliti unit di dalam cluster.';warn='Anggota dalam cluster cenderung mirip; presisi dapat menurun.'}else{title='Simple random sampling';text='Pilih unit secara acak dari kerangka sampel lengkap.';warn='Periksa coverage error dan nonresponse.'}routeTitle.textContent=title;routeText.textContent=text;routeWarn.textContent=warn;routeTitle.animate([{opacity:.2,transform:'translateY(15px)'},{opacity:1,transform:'none'}],{duration:380})}document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll(`.choice[data-q="${b.dataset.q}"]`).forEach(x=>x.classList.remove('active'));b.classList.add('active');decision[b.dataset.q]=b.dataset.v;renderRoute();tone(540,.09)});
    // Scene 23
    const factorNames=['<b class="accent">Tujuan analisis:</b> mulai dari parameter atau pengujian utama—bukan dari angka populer.','<b class="accent">Populasi:</b> koreksi populasi terbatas berarti sampel tidak meningkat tanpa batas ketika N relatif kecil.','<b class="accent">Confidence:</b> 99% membutuhkan z lebih besar daripada 95%, sehingga sampel bertambah.','<b class="accent">Margin of error:</b> karena e dikuadratkan, menurunkan galat dari 5% ke 2,5% kira-kira melipatgandakan kebutuhan empat kali pada populasi besar.','<b class="accent">Variabilitas:</b> bila p belum diketahui, p=.50 sering dipakai karena menghasilkan kebutuhan maksimum untuk proporsi.','<b class="accent">Effect size & power:</b> sampel ditentukan agar uji memiliki peluang memadai mendeteksi efek yang substantif.','<b class="accent">Desain:</b> cluster, stratifikasi, pembobotan, dan multistage mengubah varians serta kebutuhan sampel.','<b class="accent">Nonresponse:</b> naikkan jumlah undangan berdasarkan response rate realistis—bukan asumsi 100%.'];document.querySelectorAll('.factor').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.factor').forEach(x=>x.classList.remove('active'));b.classList.add('active');factorDetail.innerHTML=factorNames[i];factorDetail.animate([{opacity:.2,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:340});tone(470+i*35)});
    // Scene 24
    const formulas=[['Estimasi proporsi','Cochran untuk populasi besar','n₀ = z²p(1−p) / e²','Gunakan ketika sasaran utama adalah mengestimasi proporsi dengan confidence level dan margin of error tertentu.',['z = skor confidence','p = proporsi dugaan','e = margin of error'],'<b>Catatan:</b> asumsi simple random sampling. Desain cluster, pembobotan, dan analisis kompleks memerlukan penyesuaian.'],['Populasi terbatas','Finite population correction','n = n₀ / [1 + (n₀−1)/N]','Koreksi kebutuhan ketika populasi berukuran terbatas dan sampling fraction tidak dapat diabaikan.',['n₀ = kebutuhan awal','N = ukuran populasi','n = kebutuhan terkoreksi'],'<b>Catatan:</b> koreksi ini tidak menyembuhkan bias sampling frame atau nonresponse.'],['Tabel / rumus','Krejcie–Morgan','s = χ²NP(1−P) / [d²(N−1)+χ²P(1−P)]','Pendekatan ukuran sampel berbasis estimasi proporsi untuk populasi terbatas pada parameter yang ditentukan.',['χ² = nilai chi-square','P = proporsi','d = akurasi'],'<b>Catatan:</b> tabel populer tetap memiliki asumsi; jangan dipakai otomatis untuk semua model analisis.'],['Uji hipotesis','Power analysis','n = f(effect, α, power, model)','Tentukan efek minimum yang bermakna, tingkat kesalahan, power, serta jenis uji/model—kemudian hitung kebutuhan dengan perangkat seperti G*Power.',['effect size','α','power','prediktor/kelompok'],'<b>Catatan:</b> paling relevan ketika analisis utama adalah korelasi, regresi, uji beda, ANOVA, atau model tertentu.'],['Antisipasi respons','Penyesuaian nonresponse','nᵢₙᵥᵢₜₑ = nᵣₑqᵤᵢᵣₑd / response rate','Ubah kebutuhan respons lengkap menjadi jumlah unit yang perlu diundang.',['respons dibutuhkan','respons diharapkan','undangan'],'<b>Catatan:</b> menambah undangan tidak menghilangkan nonresponse bias bila yang tidak merespons berbeda secara sistematis.']];function setFormula(i){let f=formulas[i];formulaTag.textContent=f[0];formulaTitle.textContent=f[1];formulaMath.textContent=f[2];formulaText.textContent=f[3];formulaVars.innerHTML=f[4].map(x=>`<span>${x}</span>`).join('');formulaCritical.innerHTML=f[5];formulaPaper?.animate?.([{opacity:.25,transform:'translateX(20px)'},{opacity:1,transform:'none'}],{duration:390})}document.querySelectorAll('.formula-tab').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.formula-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');setFormula(i);tone(480+i*45)});
    // Scene 25 calculator
    function calculate(){let N=+popRange.value,z=+confSelect.value,e=+errorRange.value/100,p=+pRange.value/100,rr=+responseRange.value/100,n0=z*z*p*(1-p)/(e*e),n=n0/(1+(n0-1)/N),nr=Math.ceil(n),invite=Math.ceil(nr/rr);popOut.textContent=N.toLocaleString('id-ID');confOut.textContent='z='+z.toLocaleString('id-ID',{minimumFractionDigits:z===1.96?2:3,maximumFractionDigits:3});errorOut.textContent=(e*100).toLocaleString('id-ID')+'%';pOut.textContent=p.toLocaleString('id-ID',{minimumFractionDigits:2});responseOut.textContent=Math.round(rr*100)+'%';n0Result.textContent=Math.ceil(n0).toLocaleString('id-ID');nResult.textContent=nr.toLocaleString('id-ID');inviteResult.textContent=invite.toLocaleString('id-ID');calcNote.textContent=`Dengan N=${N.toLocaleString('id-ID')}, confidence ${confSelect.options[confSelect.selectedIndex].text}, e=${(e*100).toLocaleString('id-ID')}%, p=${p.toLocaleString('id-ID',{minimumFractionDigits:2})}, dibutuhkan sekitar ${nr.toLocaleString('id-ID')} respons. Jika respons diperkirakan ${Math.round(rr*100)}%, undang minimal ${invite.toLocaleString('id-ID')} unit.`}['popRange','confSelect','errorRange','pRange','responseRange'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{calculate();tone(560,.035)}));calculate();
    // Scene 26
    function setN(n){document.querySelectorAll('.n-btn').forEach(b=>b.classList.toggle('active',+b.dataset.n===n));let moe=1.96*Math.sqrt(.25/n)*100;errorBand.style.setProperty('--h',Math.max(65,Math.min(235,moe/17.9*235))+'px');moeValue.textContent='±'+moe.toLocaleString('id-ID',{maximumFractionDigits:1})+'%';moeMeaning.textContent=moe>12?'Rentang terlalu lebar untuk banyak keputusan praktis.':moe>7?'Presisi membaik, tetapi mungkin belum cukup untuk subkelompok.':moe>5?'Mendekati presisi 5%, periksa koreksi populasi dan desain.':'Presisi lebih sempit, tetapi biaya dan asumsi desain tetap dipertimbangkan.';tone(470+Math.min(n,500)/3,.09)}document.querySelectorAll('.n-btn').forEach(b=>b.onclick=()=>setN(+b.dataset.n));resetters[25]=()=>setN(30);
    // Bibliography
    const refs={instrument:[['01','AERA, APA, & NCME (2014) — Standards for Educational and Psychological Testing','Standar validitas, reliabilitas, dan penggunaan tes','https://www.testingstandards.net/open-access-files.html'],['02','Boateng et al. (2018) — Best Practices for Developing and Validating Scales','Frontiers in Public Health • Open access','https://doi.org/10.3389/fpubh.2018.00149'],['03','Fredricks, Blumenfeld, & Paris (2004) — School Engagement','Review of Educational Research','https://doi.org/10.3102/00346543074001059'],['04','Sullivan & Artino (2013) — Analyzing and Interpreting Data From Likert-Type Scales','Journal of Graduate Medical Education • Open access','https://doi.org/10.4300/JGME-5-4-18'],['05','Hayes & Coutts (2020) — Use Omega Rather than Cronbach’s Alpha','Communication Methods and Measures','https://doi.org/10.1080/19312458.2020.1718629']],sampling:[['06','Statistics Canada — Probability Sampling','Official sampling guidance','https://www150.statcan.gc.ca/n1/edu/power-pouvoir/ch13/prob/5214899-eng.htm'],['07','Statistics Canada — Non-probability Sampling','Official sampling guidance','https://www150.statcan.gc.ca/n1/edu/power-pouvoir/ch13/nonprob/5214898-eng.htm'],['08','Statistics Canada — Selection of a Sample','Population, sample, and sampling methods','https://www150.statcan.gc.ca/n1/edu/power-pouvoir/ch13/sample-echantillon/5214900-eng.htm'],['09','Krejcie & Morgan (1970) — Determining Sample Size for Research Activities','Educational and Psychological Measurement','https://doi.org/10.1177/001316447003000308'],['10','Faul et al. (2009) — G*Power 3.1','Behavior Research Methods','https://doi.org/10.3758/BRM.41.4.1149'],['11','Heinrich Heine University Düsseldorf — G*Power','Official software and documentation','https://www.psychologie.hhu.de/en/arbeitsgruppen/allgemeine-psychologie-und-arbeitspsychologie/gpower']]};function renderRefs(type){refsGrid.innerHTML=refs[type].map(r=>`<a class="ref-link" href="${r[3]}" target="_blank" rel="noopener"><span class="ref-num">${r[0]}</span><span class="ref-copy"><b>${r[1]}</b><span>${r[2]}</span></span><span class="ref-arrow">↗</span></a>`).join('');refsGrid.animate([{opacity:.2,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:390})}document.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-ref]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderRefs(b.dataset.ref);tone(540,.09)});renderRefs('instrument');
